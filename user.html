
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase | Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <a class="logo" href="index.html">🛍️ ShopEase</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="user.html">Products</a>
        <a href="admin.html">Admin</a>
    </nav>
    <strong>🛒 Cart: <span id="cartCount">0</span></strong>
</header>

<section class="section">
    <span class="tag">YOUR FAVOURITES ✨</span>
    <h1>Explore Our Products</h1>
    <p>Find something you'll love today!</p>

    <input class="search" id="search"
           placeholder="🔍 Search products..."
           oninput="renderProducts()">

    <select id="category" onchange="renderProducts()">
        <option value="All">All Categories</option>
        <option value="Electronics">Electronics</option>
        <option value="Accessories">Accessories</option>
    </select>

    <div class="products" id="products"></div>

    <article class="card">
        <h2>🛒 Your Shopping Cart</h2>
        <div id="cartItems">Your cart is empty.</div>
        <h3 id="total">Total: ₹0</h3>
        <button onclick="clearCart()">Clear Cart</button>
    </article>
</section>

<footer>Happy Shopping with ShopEase 💜</footer>

<script>
const products = [
    {id: 1, name: "Laptop", price: 45000,
     category: "Electronics", icon: "💻"},
    {id: 2, name: "Headphones", price: 1500,
     category: "Accessories", icon: "🎧"},
    {id: 3, name: "Smartphone", price: 25000,
     category: "Electronics", icon: "📱"},
    {id: 4, name: "Smart Watch", price: 3999,
     category: "Accessories", icon: "⌚"}
];

let cart = [];

function renderProducts() {
    const search = document.getElementById("search").value.toLowerCase();
    const category = document.getElementById("category").value;

    const filtered = products.filter(p =>
        p.name.toLowerCase().includes(search) &&
        (category === "All" || p.category === category)
    );

    document.getElementById("products").innerHTML =
        filtered.map(p => `
        <article class="product-card">
            <div class="product-icon">${p.icon}</div>
            <h3>${p.name}</h3>
            <p>${p.category}</p>
            <p class="price">₹${p.price.toLocaleString("en-IN")}</p>
            <button onclick="addToCart(${p.id})">🛒 Add to Cart</button>
        </article>
        `).join("") || "<p>No products found.</p>";
}

function addToCart(id) {
    const product = products.find(p => p.id === id);
    cart.push(product);
    renderCart();
}

function renderCart() {
    document.getElementById("cartCount").textContent = cart.length;

    document.getElementById("cartItems").innerHTML =
        cart.length
        ? cart.map((p, i) =>
            `<p>${p.name} — ₹${p.price.toLocaleString("en-IN")}
            <button onclick="removeItem(${i})">Remove</button></p>`
          ).join("")
        : "Your cart is empty.";

    const total = cart.reduce((sum, p) => sum + p.price, 0);
    document.getElementById("total").textContent =
        "Total: ₹" + total.toLocaleString("en-IN");
}

function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
}

function clearCart() {
    cart = [];
    renderCart();
}

renderProducts();
renderCart();
</script>
</body>
</html>
